<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hateful Meme Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card shadow-sm mx-auto" style="max-width:900px">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <div class="me-3">
              <img src="/static/logo.png" alt="logo" style="width:56px;height:56px;object-fit:contain;" onerror="this.style.display='none'" />
            </div>
            <div>
              <h2 class="card-title mb-0">Hateful Meme Detector</h2>
              <div class="text-muted small">Upload an image and optional caption — the model will analyze it.</div>
            </div>
          </div>

          <form method="post" enctype="multipart/form-data" id="uploadForm">
            <div class="mb-3">
              <label for="caption" class="form-label">Caption / Text (optional)</label>
              <input id="caption" name="caption" class="form-control" placeholder="Text that appears in the meme (optional)">
            </div>

            <div class="mb-3">
              <div id="dropArea" class="border rounded p-4 text-center bg-white">
                <div id="placeholder" class="mx-auto">
                  <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#6c757d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><path d="M12 15V3"/></svg>
                </div>
                <div class="mt-3 text-muted">Drag & drop an image here, or <label for="image" class="text-primary" style="cursor:pointer">browse</label></div>
                <input type="file" id="image" name="image" accept="image/*" class="d-none" required />
                <div id="preview" class="mt-3"></div>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <div class="text-muted small">Model runs locally using `ai_judge.py`. Ensure `best_model.pt` exists.</div>
              <button id="submitBtn" type="submit" class="btn btn-primary btn-lg">Analyze Image</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
  </body>
</html>
