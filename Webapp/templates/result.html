<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Result - Hateful Meme Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card shadow-sm mx-auto" style="max-width:1000px">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h3 class="mb-0">Analysis Result</h3>
            <div>
              <a href="/" class="btn btn-outline-secondary">Analyze another</a>
            </div>
          </div>

          <div class="row gy-3">
            <div class="col-md-6 text-center">
              <h6 class="text-muted">Original</h6>
              <img src="{{ image_url }}" alt="uploaded image" class="img-fluid rounded border" />
            </div>

            <div class="col-md-6 text-center">
              {% if gradcam_url %}
              <h6 class="text-muted">Grad-CAM (highlighted regions)</h6>
              <img src="{{ gradcam_url }}" alt="gradcam" class="img-fluid rounded border" />
              {% else %}
              <div class="h-100 d-flex align-items-center justify-content-center">
                <div class="text-muted">No explanation image available.</div>
              </div>
              {% endif %}
            </div>
          </div>

          <div class="mt-4">
            <h5>Verdict: <span class="badge bg-{{ 'danger' if is_hateful else 'success' }}">{{ 'Hateful / Offensive' if is_hateful else 'Safe' }}</span></h5>
            <ul class="mt-2">
              {% for e in explanation %}
              <li>{{ e }}</li>
              {% endfor %}
            </ul>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
